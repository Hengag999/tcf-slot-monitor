name: TCF Slot Monitor
on:
  schedule:
    # Offset from the top of the hour; scheduled Actions remain best-effort.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      recover_vancouver_message_id:
        description: 'Known partial Vancouver bot message to edit and reconcile without a new ping'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tcf-slot-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Reconcile a verified partial Vancouver notification
        if: ${{ inputs.recover_vancouver_message_id != '' }}
        run: npx tsx scripts/recover-vancouver-notification.ts
        env:
          RECOVER_VANCOUVER_MESSAGE_ID: ${{ inputs.recover_vancouver_message_id }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DISCORD_WEBHOOK_VANCOUVER: ${{ secrets.DISCORD_WEBHOOK_VANCOUVER }}
      - run: npx tsx scripts/scrape-slots.ts
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DISCORD_WEBHOOK_TORONTO: ${{ secrets.DISCORD_WEBHOOK_TORONTO }}
          DISCORD_WEBHOOK_CALGARY: ${{ secrets.DISCORD_WEBHOOK_CALGARY }}
          DISCORD_WEBHOOK_VANCOUVER: ${{ secrets.DISCORD_WEBHOOK_VANCOUVER }}
          DISCORD_WEBHOOK_HALIFAX: ${{ secrets.DISCORD_WEBHOOK_HALIFAX }}
          DISCORD_WEBHOOK_OTTAWA: ${{ secrets.DISCORD_WEBHOOK_OTTAWA }}
          DISCORD_WEBHOOK_ASHTON: ${{ secrets.DISCORD_WEBHOOK_ASHTON }}
          DISCORD_WEBHOOK_NORTHYORK: ${{ secrets.DISCORD_WEBHOOK_NORTHYORK }}
          DISCORD_WEBHOOK_VICTORIA: ${{ secrets.DISCORD_WEBHOOK_VICTORIA }}
          DISCORD_WEBHOOK_EDMONTON: ${{ secrets.DISCORD_WEBHOOK_EDMONTON }}
